<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
var pathSegmentsToKeep = 0;
var l = window.location;
l.replace(
  l.protocol + '//' + l.host + '/' +
  l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g,'?').replace(/%2F/g,'/') +
  (l.search ? '&' + l.search.slice(1).replace(/&/g,'~and~') : '') +
  l.hash
);
</script>
</head>
<body></body>
</html>
